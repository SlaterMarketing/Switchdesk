# Builds the Windows installer and publishes it as a GitHub Release when a version tag is pushed.
# The app checks these releases for updates (see src/updater.js).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # Tag the version in package.json (when started by hand) and create its release up front.
      # electron-builder uploads files in parallel; if the release didn't exist yet, each upload
      # could create its own copy of it.
      - name: Create the tag and release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --title "$tag" --notes "Switchdesk $tag"
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
