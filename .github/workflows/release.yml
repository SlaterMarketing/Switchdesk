# Builds the installers for Windows, macOS and Linux and publishes them as one GitHub Release
# when a version tag is pushed (or when started by hand). The app checks these releases for
# updates (see src/updater.js).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  # Tag the version in package.json (when started by hand) and create its release up front, as a
  # draft. Each platform's build uploads into it; if it didn't exist yet, parallel uploads could
  # each create their own copy. It stays a draft until the files are there, so the app never sees
  # a release without its latest.yml.
  prepare:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Create the tag and release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
          # The notes are this version's section of CHANGELOG.md.
          awk -v v="## ${tag#v}" '$0 == v {on = 1; next} on && /^## / {exit} on' CHANGELOG.md > notes.md
          [ -s notes.md ] || echo "Switchdesk $tag" > notes.md
          printf '\n**Installing on Windows:** the installer isn'"'"'t signed, so Windows may say "Windows protected your PC" the first time. Click **More info**, then **Run anyway**.\n' >> notes.md
          gh release view "$tag" >/dev/null 2>&1 || gh release create "$tag" --draft --title "Switchdesk $tag" --notes-file notes.md

  # Signed with Azure Trusted Signing once its secrets and variables are set (see SIGNING.md);
  # unsigned until then, so Windows shows a SmartScreen warning on first run.
  windows:
    needs: prepare
    runs-on: windows-latest
    env:
      SIGN: ${{ secrets.AZURE_CLIENT_SECRET != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - if: env.SIGN == 'true'
        run: node scripts/signing-config.js win
        env:
          AZURE_SIGN_ENDPOINT: ${{ vars.AZURE_SIGN_ENDPOINT }}
          AZURE_SIGN_ACCOUNT: ${{ vars.AZURE_SIGN_ACCOUNT }}
          AZURE_SIGN_PROFILE: ${{ vars.AZURE_SIGN_PROFILE }}
          AZURE_SIGN_PUBLISHER: ${{ vars.AZURE_SIGN_PUBLISHER }}
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_CLIENT_SECRET: ${{ secrets.AZURE_CLIENT_SECRET }}

  # Apple Silicon and Intel, each as a .dmg (to install) and a .zip (what updates read). Signed
  # with a Developer ID and notarised once the Apple secrets are set (see SIGNING.md); until then
  # signed ad hoc, so the first open needs right-click → Open.
  mac:
    needs: prepare
    runs-on: macos-latest
    env:
      SIGN: ${{ secrets.MAC_CSC_LINK != '' }}
      NOTARY_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' }}
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # The terminal's native module for both kinds of Mac, not just the runner's.
      - run: npm i --no-save --force @lydell/node-pty-darwin-arm64@1.2.0-beta.15 @lydell/node-pty-darwin-x64@1.2.0-beta.15
      - if: env.SIGN == 'true'
        run: node scripts/signing-config.js mac
      # Notarising with an App Store Connect API key, when one is set, instead of the Apple ID.
      - if: env.SIGN == 'true' && env.NOTARY_KEY == 'true'
        run: printf '%s' "$API_KEY" > "$RUNNER_TEMP/notary.p8"
        env:
          API_KEY: ${{ secrets.APPLE_API_KEY_P8 }}
      # If Apple refuses (an expired agreement, say), the release still gets an unsigned Mac build.
      - if: env.SIGN == 'true'
        id: signed
        continue-on-error: true
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_LINK: ${{ secrets.MAC_CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.MAC_CSC_KEY_PASSWORD }}
          # electron-builder prefers the Apple ID, so it is left out when there is a key.
          APPLE_ID: ${{ secrets.APPLE_API_KEY_P8 == '' && secrets.APPLE_ID || '' }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_API_KEY_P8 == '' && secrets.APPLE_APP_SPECIFIC_PASSWORD || '' }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_API_KEY: ${{ secrets.APPLE_API_KEY_P8 != '' && format('{0}/notary.p8', runner.temp) || '' }}
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER: ${{ secrets.APPLE_API_ISSUER }}
      - if: steps.signed.outcome == 'failure'
        run: |
          echo "::warning::Signing or notarising the Mac build failed, so this release's Mac build is unsigned. See the step above."
          git checkout package.json
          rm -rf dist
      - if: env.SIGN != 'true' || steps.signed.outcome == 'failure'
        run: npx electron-builder --mac --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'

  linux:
    needs: prepare
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx electron-builder --linux --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # Publish once Windows is there (most people's), even if a Mac or Linux build failed: those can
  # be rebuilt into the same release.
  publish:
    needs: [windows, mac, linux]
    if: always() && needs.windows.result == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "v$(node -p "require('./package.json').version")" --draft=false --latest
