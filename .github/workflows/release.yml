# Builds the Windows installer and publishes it as a GitHub Release when a version tag is pushed.
# The app checks these releases for updates (see src/updater.js).
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # When started by hand (not by pushing a tag), tag this commit with the version in package.json.
      - name: Tag the version
        if: ${{ !startsWith(github.ref, 'refs/tags/') }}
        shell: bash
        run: |
          tag="v$(node -p "require('./package.json').version")"
          if ! git ls-remote --exit-code --tags origin "$tag" >/dev/null; then
            git tag "$tag"
            git push origin "$tag"
          fi
      - run: npx electron-builder --win --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
